<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZ-Patents Clone</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React, ReactDOM, Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [appNumber, setAppNumber] = useState('');
            const [documents, setDocuments] = useState([]);
            const [loading, setLoading] = useState(false);
            const [merging, setMerging] = useState(false);
            const [zipping, setZipping] = useState(false);
            const [error, setError] = useState('');
            const [selectedDocs, setSelectedDocs] = useState(new Set());

            // ⚠️ 這裡的網址，之後要換成你部署在 Render 的後端網址 ⚠️
            const API_BASE = 'https://uspatentez.onrender.com'; 

            const handleSearch = async (e) => {
                e.preventDefault();
                if (!appNumber) return;

                setLoading(true);
                setError('');
                setDocuments([]);
                setSelectedDocs(new Set());

                try {
                    const response = await fetch(`${API_BASE}/api/patent/${appNumber}/documents`);
                    if (!response.ok) {
                        const errData = await response.json();
                        throw new Error(errData.detail || '獲取資料失敗');
                    }
                    const data = await response.json();
                    setDocuments(data.documents);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleSelectAll = (e) => {
                if (e.target.checked) {
                    const allIds = documents.map(doc => doc.document_id);
                    setSelectedDocs(new Set(allIds));
                } else {
                    setSelectedDocs(new Set());
                }
            };

            const handleSelect = (docId) => {
                const newSelected = new Set(selectedDocs);
                if (newSelected.has(docId)) {
                    newSelected.delete(docId);
                } else {
                    newSelected.add(docId);
                }
                setSelectedDocs(newSelected);
            };

            // 處理合併 PDF 下載
            const handleMergeDownload = async () => {
                if (selectedDocs.size === 0) return;
                setMerging(true);
                await downloadPostRequest('/merge', 'pdf', 'Merged.pdf');
                setMerging(false);
            };

            // 處理打包 ZIP 下載
            const handleZipDownload = async () => {
                if (selectedDocs.size === 0) return;
                setZipping(true);
                await downloadPostRequest('/zip', 'zip', 'IFW.zip');
                setZipping(false);
            };

            // 共用的 POST 下載邏輯
            const downloadPostRequest = async (endpoint, type, suffix) => {
                try {
                    const payloadDocs = documents
                        .filter(doc => selectedDocs.has(doc.document_id))
                        .map(doc => ({
                            document_id: doc.document_id,
                            description: doc.description,
                            date: doc.date
                        }));

                    const response = await fetch(`${API_BASE}/api/patent/${appNumber}${endpoint}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ documents: payloadDocs })
                    });

                    if (!response.ok) throw new Error(`${type.toUpperCase()} 處理失敗`);

                    const blob = await response.blob();
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = downloadUrl;
                    const cleanNum = appNumber.replace(/\D/g, '');
                    link.download = `US_${cleanNum}_${suffix}`;
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    window.URL.revokeObjectURL(downloadUrl);
                } catch (err) {
                    alert(err.message);
                }
            };

            return (
                <div className="max-w-5xl mx-auto p-4 md:p-6 font-sans">
                    <h1 className="text-2xl md:text-3xl font-bold mb-6 text-gray-800">EZ-Patents Clone</h1>
                    
                    <form onSubmit={handleSearch} className="flex flex-col md:flex-row gap-4 mb-8">
                        <input
                            type="text"
                            value={appNumber}
                            onChange={(e) => setAppNumber(e.target.value)}
                            placeholder="輸入美國專利申請號 (例如: 14/472,023)"
                            className="flex-1 border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm"
                        />
                        <button 
                            type="submit" 
                            disabled={loading}
                            className="bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700 disabled:opacity-50 font-medium shadow-sm transition-colors"
                        >
                            {loading ? '搜尋中...' : '搜尋歷史文件'}
                        </button>
                    </form>

                    {error && (
                        <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-6 shadow-sm">
                            {error}
                        </div>
                    )}

                    {documents.length > 0 && (
                        <div className="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden mb-20">
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse min-w-[600px]">
                                    <thead>
                                        <tr className="bg-gray-50 border-b border-gray-200">
                                            <th className="p-4 w-12 text-center">
                                                <input 
                                                    type="checkbox" 
                                                    onChange={handleSelectAll}
                                                    checked={selectedDocs.size === documents.length && documents.length > 0}
                                                    className="w-4 h-4 text-blue-600 rounded border-gray-300"
                                                />
                                            </th>
                                            <th className="p-4 font-semibold text-gray-600">日期</th>
                                            <th className="p-4 font-semibold text-gray-600">文件描述</th>
                                            <th className="p-4 font-semibold text-gray-600">頁數</th>
                                            <th className="p-4 font-semibold text-gray-600 text-right">單檔下載</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {documents.map((doc) => (
                                            <tr key={doc.document_id} className="border-b border-gray-100 hover:bg-gray-50 transition-colors">
                                                <td className="p-4 text-center">
                                                    <input 
                                                        type="checkbox"
                                                        checked={selectedDocs.has(doc.document_id)}
                                                        onChange={() => handleSelect(doc.document_id)}
                                                        className="w-4 h-4 text-blue-600 rounded border-gray-300"
                                                    />
                                                </td>
                                                <td className="p-4 text-gray-700 whitespace-nowrap">{doc.date}</td>
                                                <td className="p-4">
                                                    <div className="font-medium text-gray-800">{doc.description}</div>
                                                    <div className="text-sm text-gray-500 mt-1">{doc.document_code}</div>
                                                </td>
                                                <td className="p-4 text-gray-700 whitespace-nowrap">{doc.page_count} 頁</td>
                                                <td className="p-4 text-right whitespace-nowrap">
                                                    <a 
                                                        href={`${API_BASE}/api/patent/${appNumber}/document/${doc.document_id}/download`}
                                                        target="_blank"
                                                        rel="noopener noreferrer"
                                                        className="text-blue-600 hover:text-blue-800 text-sm font-medium hover:underline"
                                                    >
                                                        下載 PDF
                                                    </a>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                            
                            <div className="bg-gray-50 border-t border-gray-200 p-4 flex flex-col sm:flex-row justify-between items-center gap-4 fixed bottom-0 left-0 right-0 max-w-5xl mx-auto shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
                                <span className="text-gray-700 font-medium">
                                    已選擇 {selectedDocs.size} 份文件
                                </span>
                                <div className="flex gap-3 w-full sm:w-auto">
                                    <button
                                        onClick={handleZipDownload}
                                        disabled={selectedDocs.size === 0 || zipping || merging}
                                        className="flex-1 sm:flex-none bg-gray-600 text-white px-6 py-2.5 rounded-lg hover:bg-gray-700 disabled:opacity-50 transition-colors font-medium text-sm"
                                    >
                                        {zipping ? '打包中...' : '下載 ZIP'}
                                    </button>
                                    <button
                                        onClick={handleMergeDownload}
                                        disabled={selectedDocs.size === 0 || merging || zipping}
                                        className="flex-1 sm:flex-none bg-green-600 text-white px-6 py-2.5 rounded-lg hover:bg-green-700 disabled:opacity-50 transition-colors font-medium text-sm"
                                    >
                                        {merging ? '合併中...' : '合併為單一 PDF'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
